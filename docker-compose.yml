version: "3.8"

services:
  arxiv2notion:
    build: .
    volumes:
      - ./cache:/app/cache
      - ./papers:/app/papers
      - ./logs:/app/logs
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_ROOT_PAGE_ID=${NOTION_ROOT_PAGE_ID}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - QWEN_ENABLED=${QWEN_ENABLED:-true}
      - ARXIV_REQUEST_DELAY=${ARXIV_REQUEST_DELAY:-3.0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Override CMD to run a specific paper:
    #   docker compose run arxiv2notion 1706.03762 --with-refs
    #   docker compose run arxiv2notion --from-file examples/single/1706.03762.json
