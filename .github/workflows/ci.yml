name: Python CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/m00-*", "feat/m01-*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q main.py config.py models.py utils.py fetch process notion storage tests
      - name: Run unit tests
        run: python -m pytest tests/ -q
